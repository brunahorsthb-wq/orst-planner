<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Planner Bruna v3.0 - Com Agenda</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #7d8c6d; --secondary: #d98c8c; --accent: #d9b38c;
            --success: #27ae60; --warning: #f39c12; --danger: #e74c3c;
            --dark: #2c3e50; --light: #ecf0f1; --white: #ffffff;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.1); --shadow-lg: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark); min-height: 100vh; overflow-x: hidden;
        }
        header {
            background: linear-gradient(135deg, var(--primary) 0%, #96a07d 100%);
            color: var(--white); padding: 20px; box-shadow: var(--shadow-lg);
            position: sticky; top: 0; z-index: 100;
        }
        .header-content {
            max-width: 1200px; margin: 0 auto; display: flex;
            justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
        }
        .logo { font-family: 'Dancing Script', cursive; font-size: 28px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .header-stats { display: flex; gap: 20px; font-size: 13px; }
        .stat-item { display: flex; align-items: center; gap: 8px; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid #e0e0e0; overflow-x: auto; flex-wrap: wrap; }
        .tab-btn { padding: 12px 20px; background: none; border: none; cursor: pointer; font-weight: 600; color: #7f8c8d; border-bottom: 3px solid transparent; transition: all 0.3s ease; white-space: nowrap; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Agenda View */
        .agenda-container { background: var(--white); padding: 25px; border-radius: 15px; box-shadow: var(--shadow); }
        .agenda-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .agenda-header h2 { color: var(--primary); font-size: 20px; }
        .day-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .day-btn { padding: 8px 16px; background: #f0f0f0; border: 2px solid transparent; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
        .day-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .timeline { position: relative; padding: 20px 0; }
        .timeline-item { display: flex; margin-bottom: 20px; position: relative; }
        .timeline-time { width: 100px; font-weight: bold; color: var(--primary); text-align: right; padding-right: 20px; }
        .timeline-event { flex: 1; padding: 15px; border-radius: 10px; border-left: 4px solid var(--primary); background: #f8f9fa; position: relative; }
        .timeline-event.trabalho { border-left-color: #27ae60; background: #d4edda; }
        .timeline-event.treino { border-left-color: #e74c3c; background: #f5c6cb; }
        .timeline-event.alimentacao { border-left-color: #f39c12; background: #fff3cd; }
        .timeline-event.descanso { border-left-color: #9b59b6; background: #e2d5f0; }
        .timeline-event.estudo { border-left-color: #3498db; background: #d1ecf1; }
        
        .event-title { font-weight: 600; color: var(--dark); margin-bottom: 5px; }
        .event-duration { font-size: 12px; color: #7f8c8d; }
        
        /* Daily Routine */
        .daily-routine { background: var(--white); padding: 25px; border-radius: 15px; box-shadow: var(--shadow); }
        .routine-item { display: flex; gap: 15px; margin-bottom: 15px; padding: 15px; background: #f8f9fa; border-radius: 10px; border-left: 4px solid var(--primary); }
        .routine-time { font-weight: bold; color: var(--primary); min-width: 80px; }
        
        /* Habits */
        .habits-premium { background: var(--white); padding: 25px; border-radius: 15px; box-shadow: var(--shadow); margin-bottom: 30px; }
        .progress-bar { width: 100%; height: 10px; background: #e0e0e0; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--success) 0%, var(--accent) 100%); transition: width 0.3s ease; display: flex; align-items: center; justify-content: center; color: var(--white); font-size: 11px; font-weight: bold; }
        .habits-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .habit-card { background: linear-gradient(135deg, #f8f9fa 0%, #e8eef5 100%); padding: 15px; border-radius: 10px; border-left: 4px solid var(--primary); cursor: pointer; transition: all 0.3s ease; }
        .habit-card.completed { background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%); border-left-color: var(--success); }
        
        .notification { position: fixed; top: 20px; right: 20px; background: var(--success); color: var(--white); padding: 15px 20px; border-radius: 8px; box-shadow: var(--shadow-lg); z-index: 2000; display: none; }
        
        @media (max-width: 768px) { .header-content { flex-direction: column; } .tabs { flex-direction: column; } }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo"><i class="fas fa-calendar-alt"></i> Super Planner Bruna v3.0</div>
            <div class="header-stats">
                <div class="stat-item"><i class="fas fa-fire"></i> <span id="streakDisplay">Streak: 0</span></div>
                <div class="stat-item"><i class="fas fa-target"></i> <span id="goalsDisplay">Metas: 0/0</span></div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('agenda')">📅 Agenda</button>
            <button class="tab-btn" onclick="switchTab('rotina')">🕐 Rotina</button>
            <button class="tab-btn" onclick="switchTab('habits')">❤️ Hábitos</button>
            <button class="tab-btn" onclick="switchTab('goals')">🎯 Metas</button>
            <button class="tab-btn" onclick="switchTab('cardapio')">🍽️ Cardápio</button>
        </div>

        <div id="agenda" class="tab-content active">
            <div class="agenda-container">
                <div class="agenda-header"><h2>Sua Agenda Semanal</h2></div>
                <div class="day-selector" id="daySelector"></div>
                <div class="timeline" id="timeline"></div>
            </div>
        </div>

        <div id="rotina" class="tab-content">
            <div class="daily-routine">
                <h2 style="color:var(--primary);margin-bottom:20px">Minha Rotina Diária</h2>
                <div id="routineList"></div>
            </div>
        </div>

        <div id="habits" class="tab-content">
            <div class="habits-premium">
                <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%">0%</div></div>
                <div class="habits-grid" id="habitsGrid"></div>
            </div>
        </div>

        <div id="goals" class="tab-content">
            <div style="background:var(--white);padding:25px;border-radius:15px;box-shadow:var(--shadow)">
                <input type="text" id="goalInput" placeholder="Nova meta..." style="padding:10px;width:70%;border:2px solid #e0e0e0;border-radius:8px">
                <button onclick="addGoal()" style="padding:10px 20px;background:var(--primary);color:white;border:none;border-radius:8px;cursor:pointer">Add</button>
                <div id="goalsList" style="margin-top:20px"></div>
            </div>
        </div>

        <div id="cardapio" class="tab-content">
            <div style="background:var(--white);padding:25px;border-radius:15px;box-shadow:var(--shadow)">
                <h2 style="color:var(--primary);margin-bottom:20px">Sugestão de Cardápio</h2>
                <div id="mealList"></div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        let plannerData = {
            habits: [
                { name: 'Acordar cedo', completed: false, streak: 7 },
                { name: 'Contemplação', completed: false, streak: 5 },
                { name: 'Treino', completed: false, streak: 4 },
                { name: 'Alimentação saudável', completed: false, streak: 6 },
                { name: 'Estudos', completed: false, streak: 3 },
                { name: 'Organização/Casa', completed: false, streak: 2 },
                { name: 'Sono de qualidade', completed: false, streak: 8 }
            ],
            goals: [],
            agenda: [
                { time: '05:45', title: 'Acordar', category: 'descanso', duration: 15 },
                { time: '06:00', title: 'Café da Manhã', category: 'alimentacao', duration: 30 },
                { time: '06:30', title: 'Sair para o Trabalho', category: 'trabalho', duration: 30 },
                { time: '07:00', title: 'Trabalho no Centrão', category: 'trabalho', duration: 720 },
                { time: '11:00', title: 'Almoço', category: 'alimentacao', duration: 60 },
                { time: '14:30', title: 'Treino - Musculação', category: 'treino', duration: 90 },
                { time: '17:00', title: 'Jantar', category: 'alimentacao', duration: 30 },
                { time: '21:00', title: 'Dormir', category: 'descanso', duration: 480 }
            ]
        };

        function initialize() {
            loadData();
            renderAgenda();
            renderRoutine();
            renderHabits();
            renderGoals();
            renderMeals();
        }

        function renderAgenda() {
            const selector = document.getElementById('daySelector');
            const timeline = document.getElementById('timeline');
            selector.innerHTML = ''; timeline.innerHTML = '';
            const days = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sab', 'Dom'];
            days.forEach((day, i) => {
                const btn = document.createElement('button');
                btn.className = `day-btn ${i === new Date().getDay()-1 ? 'active' : ''}`;
                btn.textContent = day;
                btn.onclick = () => { document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); };
                selector.appendChild(btn);
            });
            plannerData.agenda.forEach(event => {
                timeline.innerHTML += `
                    <div class="timeline-item">
                        <div class="timeline-time">${event.time}</div>
                        <div class="timeline-event ${event.category}">
                            <div class="event-title">${event.title}</div>
                            <div class="event-duration">⏱️ ${event.duration} min</div>
                        </div>
                    </div>`;
            });
        }

        function renderRoutine() {
            const list = document.getElementById('routineList');
            list.innerHTML = '';
            plannerData.agenda.forEach(event => {
                list.innerHTML += `
                    <div class="routine-item">
                        <div class="routine-time">${event.time}</div>
                        <div class="routine-content"><div class="routine-title">${event.title}</div></div>
                    </div>`;
            });
        }

        function renderHabits() {
            const grid = document.getElementById('habitsGrid');
            grid.innerHTML = '';
            plannerData.habits.forEach((h, i) => {
                const card = document.createElement('div');
                card.className = `habit-card ${h.completed ? 'completed' : ''}`;
                card.onclick = () => toggleHabit(i);
                card.innerHTML = `<strong>${h.name}</strong><br><small>🔥 ${h.streak} dias</small>`;
                grid.appendChild(card);
            });
            updateProgress();
        }

        function toggleHabit(i) {
            plannerData.habits[i].completed = !plannerData.habits[i].completed;
            if(plannerData.habits[i].completed) plannerData.habits[i].streak++;
            renderHabits(); saveData(); showNotif('✅ Atualizado!');
        }

        function updateProgress() {
            const done = plannerData.habits.filter(h => h.completed).length;
            const perc = Math.round((done / plannerData.habits.length) * 100);
            document.getElementById('progressFill').style.width = perc + '%';
            document.getElementById('progressFill').textContent = perc + '%';
        }

        function addGoal() {
            const val = document.getElementById('goalInput').value;
            if(!val) return;
            plannerData.goals.push({ title: val, completed: false });
            document.getElementById('goalInput').value = '';
            renderGoals(); saveData();
        }

        function renderGoals() {
            const list = document.getElementById('goalsList');
            list.innerHTML = '';
            plannerData.goals.forEach((g, i) => {
                list.innerHTML += `<div style="padding:10px;background:#f8f9fa;margin-bottom:5px;border-radius:8px;display:flex;justify-content:space-between"><span>${g.title}</span><button onclick="deleteGoal(${i})" style="background:var(--danger);color:white;border:none;border-radius:4px;padding:5px 10px;cursor:pointer">X</button></div>`;
            });
            document.getElementById('goalsDisplay').textContent = `Metas: ${plannerData.goals.filter(g => g.completed).length}/${plannerData.goals.length}`;
        }

        function deleteGoal(i) { plannerData.goals.splice(i, 1); renderGoals(); saveData(); }

        function renderMeals() {
            document.getElementById('mealList').innerHTML = `
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px">
                    <div style="background:#d4edda;padding:15px;border-radius:8px"><strong>Almoço</strong><br>Arroz, feijão e carne</div>
                    <div style="background:#fff3cd;padding:15px;border-radius:8px"><strong>Jantar</strong><br>Pão com hambúrguer</div>
                </div>`;
        }

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(t).classList.add('active');
            event.target.classList.add('active');
        }

        function showNotif(m) {
            const n = document.getElementById('notification');
            n.textContent = m; n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 3000);
        }

        function saveData() { localStorage.setItem('planner_bruna_v3', JSON.stringify(plannerData)); }
        function loadData() { const d = localStorage.getItem('planner_bruna_v3'); if(d) plannerData = JSON.parse(d); }

        window.onload = initialize;
    </script>
</body>
</html>
